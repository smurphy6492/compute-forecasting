[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compute-forecasting"
version = "0.1.0"
description = "ML-driven compute capacity forecasting with scenario planning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Sean Murphy"},
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "shap>=0.45.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    "jupyter>=1.0.0",
    "nbformat>=5.10.0",
]

[project.optional-dependencies]
production = [
    "mlflow>=3.0",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
